{% extends "layout.html" %}

{% block body %}

	<h1>Register</h1>
	<form action="/register" method="post" >
		<input autocomplete="off" autofocus placeholder="name" name="name" required type="text">
		<select name="sport" required>
			<option disabled selected value="">Sports</option>
			{% for sport in sports %}
				<option value="{{ sport }}">{{ sport }}</option>
			{% endfor %}
		</select>
		<button type="submit">register</button>
	</form>	
{% endblock %}
